# Netlify publica solo la landing page estática.
# El POS (frontend/backend) es local y no se despliega.
[build]
  base    = "landing"
  publish = "."
  command = ""
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
